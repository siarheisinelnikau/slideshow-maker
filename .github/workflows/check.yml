name: Check Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the companion updater source
        shell: pwsh
        run: |
          if (-not (Test-Path ../rust-auto-updator/crates/rust-auto-updator/Cargo.toml)) {
            throw 'This local integration requires the rust-auto-updator workspace beside slideshow-maker. Provision the companion source before standalone CI can run.'
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo run --locked --example render_fixture
      - run: ./scripts/package.ps1
        shell: pwsh
      - run: python scripts/verify-release.py dist/SlideshowMaker-v0.1.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SlideshowMaker-Windows-x64
          path: dist/
