name: Check Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - name: Require the companion updater source
        shell: pwsh
        run: |
          if (-not (Test-Path ../rust-auto-updator/crates/rust-auto-updator/Cargo.toml)) {
            throw 'This local integration requires the rust-auto-updator workspace beside slideshow-maker. Provision the companion source before standalone CI can run.'
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo run --locked --example render_fixture
      - run: ./scripts/package.ps1
        shell: pwsh
      - name: Inspect the current versioned release executable
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content -LiteralPath Cargo.toml -Raw), '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"').Groups[1].Value
          if (-not $version) { throw 'Cannot read the release package version.' }
          python scripts/verify-release.py "dist/SlideshowMaker-v$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Release executable inspection failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: SlideshowMaker-Windows-x64
          path: dist/

  localization-release:
    name: Publish the explicitly requested localization release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: localization-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SlideshowMaker-Windows-x64
          path: .release-input
      - name: Verify the checked executable, companion and notices
        shell: pwsh
        run: ./scripts/stage-localization-release.ps1
      - name: Publish only after every asset is verified
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
