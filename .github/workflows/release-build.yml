name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  check:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Provision shared updater source
      shell: pwsh
      run: ./scripts/provision-shared-updater.ps1
    - name: Require the companion updater source
      shell: pwsh
      run: |
        if (-not (Test-Path ../rust-auto-updator/crates/rust-auto-updator/Cargo.toml)) {
          throw 'This local integration requires the rust-auto-updator workspace beside slideshow-maker. Provision the companion source before standalone CI can run.'
        }
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
        toolchain: stable
    - run: cargo fmt --all -- --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked --all-targets
    - run: cargo run --locked --example render_fixture
    - run: ./scripts/package.ps1
      shell: pwsh
    - name: Inspect the current versioned release executable
      shell: pwsh
      run: |
        $version = [regex]::Match((Get-Content -LiteralPath Cargo.toml -Raw), '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"').Groups[1].Value
        if (-not $version) { throw 'Cannot read the release package version.' }
        python scripts/verify-release.py "dist/SlideshowMaker-v$version.exe"
        if ($LASTEXITCODE -ne 0) { throw 'Release executable inspection failed.' }
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: SlideshowMaker-Windows-x64
        path: dist/
    permissions:
      contents: read
    timeout-minutes: 30
