[package]
name = "slideshow-maker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A small family photo slideshow editor with local video export"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
epaint_default_fonts = "=0.37.0"
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
tempfile = "3.27"
ureq = "3.5"

[profile.release]
opt-level = 3

