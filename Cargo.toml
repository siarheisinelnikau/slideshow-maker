[package]
name = "slideshow-maker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A small family photo slideshow editor with local video export"

[dependencies]
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
bytemuck = "1.24"
epaint_default_fonts = "=0.33.3"
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "isomp4", "aac", "alac", "aiff"] }
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[profile.release]
opt-level = 3

